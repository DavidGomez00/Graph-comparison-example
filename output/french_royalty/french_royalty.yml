# GENERAL ARGS #
schema_name: french_royalty
format: xml

# Not used to generate output/french_royalty/schema.rdf itself 
# (this, class_info.json, and relation_info.json, were hand-crafted)
# These values just document the characteristics that were encoded by
# hand, and drive the KG-generation step (num_entities/num_triples/
# relation_balance_ratio/prop_untyped_entities below).

# SCHEMA ARGS #
## CLASSES ##
num_classes: 2
max_hierarchy_depth: 2
avg_class_depth: 1
class_inheritance_ratio: 1.0
avg_disjointness: 0.0
verbose: true

## RELATIONS ##
num_relations: 7
relation_specificity: 1.0
prop_profiled_relations: 1.0
profile_side: both
prop_symmetric_relations: 0.0
prop_inverse_relations: 0.0
prop_transitive_relations: 0.0
prop_asymmetric_relations: 0.0
prop_reflexive_relations: 0.0
prop_irreflexive_relations: 1.0
prop_functional_relations: 0.0
prop_inverse_functional_relations: 0.0
prop_subproperties: 0.0

# KNOWLEDGE GRAPH ARGS ##
# .data/french_royalty/french_royalty.tsv has 2211 unique entities (every one
# of them carries an explicit `type Person` triple -- unlike the earlier,
# uncorrected dataset, this one is fully typed) and 6422 relation triples
# (child 1897, parent 1239, spouse 1152, father 658, mother 534, successor
# 471, predecessor 471). num_triples = 6422 relation + 2211 type = 8633.
num_entities: 2211
num_triples: 8633
fast_gen: true
oversample: false
# Real per-relation triple counts are skewed (child 1897 vs
# successor/predecessor 471, ~4x. PyGraft distributes triples across relations as random weights of
# magnitude (1 - relation_balance_ratio); anything below ~0.7 has a
# non-trivial chance of zeroing out a relation entirely over these 7
# relations (checked empirically, see docs/Determining relation distribution).
relation_balance_ratio: 0.7
prop_untyped_entities: 0.0
avg_depth_specific_class: 1.0
multityping: false
avg_multityping: 0.0
